[package]
name = "axiograph-llm-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LLM evidence extraction, grounding, and reconciliation inputs for Axiograph"

[dependencies]
axiograph-dsl = { path = "../axiograph-dsl" }
axiograph-pathdb = { path = "../axiograph-pathdb" }
axiograph-storage = { path = "../axiograph-storage" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
regex.workspace = true
tracing.workspace = true
parking_lot.workspace = true
ciborium.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = []
openai = ["reqwest"]
anthropic = ["reqwest"]
local = ["reqwest"]
full = ["openai", "anthropic", "local"]
