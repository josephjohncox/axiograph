[package]
name = "axiograph-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
  "crates/axiograph-cli",
  "crates/axiograph-query",
  "crates/axiograph-security",
  "crates/axiograph-dsl",
  "crates/axiograph-kernel",
  "crates/axiograph-projections",
  "crates/axiograph-store",
  "crates/axiograph-ingest-docs",
  "crates/axiograph-ingest-structured",
  "crates/axiograph-ingest-proto",
  "crates/axiograph-ingest-rdfowl",
  "crates/axiograph-tooling-overlays",
  "crates/axiograph-example-industrial",
  "crates/axiograph-example-regulated-shipment",
  "crates/axiograph-example-software-authoring",
  "crates/axiograph-software-authoring",
  "crates/axiograph-pathdb",
  "crates/axiograph-llm-sync",
  "crates/axiograph-storage",
]

[workspace.package]
version = "20260908.0.0"
edition = "2021"
rust-version = "1.93"
authors = ["Axiograph Team"]
license = "BSD-3-Clause"
repository = "https://github.com/josephjohncox/axiograph"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus)'] }

[workspace.dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"                                   # CBOR serialization
crossbeam-channel = "0.5"
schemars = "1.2"
loom = "0.7.2"

# Parsing
regex = "1.10"
nom = "8.0"

# CLI
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"

# Ingestion
sophia = "0.10" # RDF parsing toolkit (Turtle/N-Triples/N-Quads/TriG)
# oxrdfxml 0.2.4 still requires vulnerable quick-xml 0.37. Pin the maintained
# upstream quick-xml 0.42 migration until the next patched oxrdfxml release.
oxrdf = { git = "https://github.com/oxigraph/oxigraph.git", rev = "786d00170224cb5589b03dc5283b1c25df8c0357", features = [
  "rdf-12",
] }
oxrdfxml = { git = "https://github.com/oxigraph/oxigraph.git", rev = "786d00170224cb5589b03dc5283b1c25df8c0357", features = [
  "rdf-12",
] }
quick-xml = "0.42" # RDF/XML structural preflight and parser dependency
sqlparser = "0.62" # SQL parsing
pdf-extract = "0.12" # PDF text extraction
walkdir = "2.4"

# Async (for gRPC/network)
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
rmcp = { version = "3.2.0", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-io",
] }
lsp-server = "0.10.0"
lsp-types = "0.97"

# UUID and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
process-wrap = { version = "10.0.0", default-features = false }
rustix = { version = "1.1.4", default-features = false }
rusqlite = { version = "0.40.2", features = [
  "backup",
  "bundled",
  "limits",
  "serialize",
] }

# Logging
tracing = "0.1"
pprof = { version = "0.15", default-features = false, features = [
  "prost-codec",
] }
inferno = { version = "0.12.8", default-features = false }
prost-reflect = "0.16.3"
signal-hook = "0.4"

# PathDB: Efficient binary storage
roaring = { version = "0.11", features = ["serde"] } # Roaring bitmaps
ahash = { version = "0.8", features = ["serde"] }    # Fast hashing
dashmap = "6"                                        # Concurrent hash map
parking_lot = "0.12"                                 # Better mutexes

# HTTP client for LLM APIs
reqwest = { version = "0.13", features = ["json"] }

# Web ingestion / scraping (tooling, untrusted boundary)
url = "2.5"
percent-encoding = "2.3"
scraper = "0.27"
htmd = "0.5.0"
robotstxt = "0.3.0"

# Property testing
proptest = "1.4"

# ============================================================================
# Workspace-level integration tests
# ============================================================================

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "backend_container_tests"
path = "tests/backend_container_tests.rs"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
axiograph-dsl = { path = "crates/axiograph-dsl" }
axiograph-storage = { path = "crates/axiograph-storage" }
axiograph-pathdb = { path = "crates/axiograph-pathdb" }
axiograph-llm-sync = { path = "crates/axiograph-llm-sync" }
tokio.workspace = true
chrono.workspace = true
reqwest.workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
