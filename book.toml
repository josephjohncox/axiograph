[book]
title = "Axiograph — Proof-Carrying Ontology Engineering"
authors = ["Joseph Cox and Axiograph contributors"]
description = "A practical book about typed ontology engineering, finite proof-carrying claims, semantic version control, and trustworthy AI integration."
language = "en"
text-direction = "ltr"
src = "docs"

[build]
build-dir = "build/book"
create-missing = false
use-default-preprocessors = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
definition-lists = true
admonitions = true
mathjax-support = true
additional-css = ["theme/axiograph.css"]
no-section-label = false
git-repository-url = "https://github.com/josephjohncox/axiograph"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/josephjohncox/axiograph/edit/main/{path}"
site-url = "/axiograph/"
input-404 = "404.md"

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true
page-break = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
