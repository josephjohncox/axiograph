name: Container

on:
  workflow_call:
    inputs:
      publish_tag:
        description: Allow tag publication from the release-gated caller
        required: true
        type: boolean
      release_version:
        description: Validated YYYYMMDD.0.N application version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, audit, and push linux/${{ matrix.arch }} by digest
    if: inputs.publish_tag
    env:
      AXIOGRAPH_CLI_VERSION: ${{ inputs.release_version }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      # actions/checkout pinned to an immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require exact CalVer release tag caller
        run: |
          set -euo pipefail
          python3 scripts/release_version.py validate \
            "$AXIOGRAPH_CLI_VERSION" >/dev/null
          python3 scripts/release_version.py validate-tag \
            "$GITHUB_REF_NAME" "$AXIOGRAPH_CLI_VERSION" >/dev/null
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
      # docker/setup-buildx-action pinned to an immutable commit.
      - uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Validate Dockerfile with BuildKit
        run: docker buildx build --check --progress=plain -f Dockerfile .
      # docker/login-action pinned to an immutable commit.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing release container tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          release_ref="${IMAGE}:v${AXIOGRAPH_CLI_VERSION}"
          if inspect_error="$(docker buildx imagetools inspect \
            "$release_ref" 2>&1)"; then
            echo "container tag already exists: $release_ref" >&2
            exit 1
          elif ! grep -Eiq \
            'not found|manifest unknown|no such manifest' \
            <<<"$inspect_error"; then
            echo "$inspect_error" >&2
            echo "could not prove container tag availability" >&2
            exit 1
          fi
      - name: Docker metadata
        id: meta
        # docker/metadata-action pinned to an immutable commit.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,enable=${{ inputs.publish_tag }}
            type=sha
      - name: Build local image for pre-publication audit
        # docker/build-push-action pinned to an immutable commit.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          platforms: linux/${{ matrix.arch }}
          tags: axiograph-release-audit:${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Audit local image before registry write
        env:
          LOCAL_REF: axiograph-release-audit:${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "$LOCAL_REF" -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            cd /usr/local/bin
            sha256sum -c \
              /usr/local/share/axiograph/axiograph_verify.sha256
          '
          docker run --rm "$LOCAL_REF" --version |
            grep -Fx "axiograph ${AXIOGRAPH_CLI_VERSION}"
          checker_dir="$(mktemp -d)"
          container_id="$(docker create "$LOCAL_REF")"
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            rm -rf "$checker_dir"
          }
          trap cleanup EXIT
          docker cp \
            "$container_id:/usr/local/bin/axiograph_verify" \
            "$checker_dir/axiograph_verify"
          docker rm "$container_id" >/dev/null
          container_id=""
          chmod 0755 "$checker_dir/axiograph_verify"
          python3 scripts/run_release_fixture_suite.py \
            --checker "$checker_dir/axiograph_verify" \
            --manifest release/fixtures.json \
            --repo-root "$PWD"
          fixture="$PWD/examples/ontology/OntologyRewrites.axi"
          docker run --rm \
            -v "$fixture:/tmp/ContainerSmoke.axi:ro" \
            "$LOCAL_REF" check validate /tmp/ContainerSmoke.axi
      - name: Build and push audited image as an untagged digest
        id: build
        # docker/build-push-action pinned to an immutable commit.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          outputs: >-
            type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true
          labels: ${{ steps.meta.outputs.labels }}
      - name: Pull and audit pushed image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}@${IMAGE_DIGEST}"
          docker pull "$REF"
          docker run --rm --entrypoint /bin/sh "$REF" -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            test ! -w /usr/local/bin/axiograph
            test ! -w /usr/local/bin/axiograph_verify
            test ! -w /usr/local/share/axiograph/axiograph_verify.sha256
            test ! -w /usr/local/share/axiograph/accepted-plane-smoke.json
            cd /usr/local/bin
            sha256sum -c \
              /usr/local/share/axiograph/axiograph_verify.sha256
            marker=/usr/local/share/axiograph/accepted-plane-smoke.json
            grep -Fx "  \"accepted_manifest\": \"verified\"," "$marker"
            schema_value=axiograph-container-accepted-plane-smoke-v2
            grep -Fx "  \"schema\": \"$schema_value\"," "$marker"
            grep -Fx "  \"unaccepted_manifest\": \"rejected\"" "$marker"
          '
          docker run --rm "$REF" --version |
            grep -Fx "axiograph ${AXIOGRAPH_CLI_VERSION}"
          checker_dir="$(mktemp -d)"
          container_id="$(docker create "$REF")"
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            rm -rf "$checker_dir"
          }
          trap cleanup EXIT
          docker cp \
            "$container_id:/usr/local/bin/axiograph_verify" \
            "$checker_dir/axiograph_verify"
          docker rm "$container_id" >/dev/null
          container_id=""
          chmod 0755 "$checker_dir/axiograph_verify"
          python3 scripts/run_release_fixture_suite.py \
            --checker "$checker_dir/axiograph_verify" \
            --manifest release/fixtures.json \
            --repo-root "$PWD"
      - name: Smoke canonical input and authenticated DB CLI contract
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}@${IMAGE_DIGEST}"
          fixture="$PWD/examples/ontology/OntologyRewrites.axi"

          docker run --rm \
            -v "$fixture:/tmp/ContainerSmoke.axi:ro" \
            "$REF" check validate /tmp/ContainerSmoke.axi

          help="$(docker run --rm "$REF" db --help)"
          grep -q 'materialize' <<<"$help"
          grep -q 'materialization-show' <<<"$help"
          grep -q 'serve' <<<"$help"
          if grep -qE '(^|[[:space:]])accept([[:space:]]|$)' <<<"$help"; then
            echo "removed accepted-plane CLI unexpectedly present" >&2
            exit 1
          fi

          if docker run --rm "$REF" db serve \
            --axpd /tmp/unbound.axpd --listen 127.0.0.1:7878; then
            echo "bare --axpd server startup unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Write audited image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest_file="/tmp/digests/${{ matrix.arch }}.digest"
          printf '%s\n' "$IMAGE_DIGEST" > "$digest_file"
      - name: Upload audited digest artifact
        # actions/upload-artifact pinned to an immutable commit.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-digests-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}.digest
          if-no-files-found: error

  publish-manifest:
    name: Publish audited multi-arch manifest
    if: inputs.publish_tag
    runs-on: ubuntu-24.04
    needs: build-and-push
    environment: release
    env:
      AXIOGRAPH_CLI_VERSION: ${{ inputs.release_version }}
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout pinned to an immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # docker/setup-buildx-action pinned to an immutable commit.
      - uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      # docker/login-action pinned to an immutable commit.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # actions/download-artifact pinned to an immutable commit.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests
      - name: Create and verify exact release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py validate \
            "$AXIOGRAPH_CLI_VERSION" >/dev/null
          release_ref="${IMAGE}:v${AXIOGRAPH_CLI_VERSION}"
          tag_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          test "$(gh api "$tag_path" --jq '.object.type')" = tag
          tag_object="$(gh api "$tag_path" --jq '.object.sha')"
          tag_target="repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          test "$(gh api "$tag_target" --jq '.object.type')" = commit
          test "$(gh api "$tag_target" --jq '.object.sha')" = "$GITHUB_SHA"

          if inspect_error="$(docker buildx imagetools inspect \
            "$release_ref" 2>&1)"; then
            echo "container tag already exists: $release_ref" >&2
            exit 1
          elif ! grep -Eiq \
            'not found|manifest unknown|no such manifest' \
            <<<"$inspect_error"; then
            echo "$inspect_error" >&2
            echo "could not prove container tag availability" >&2
            exit 1
          fi

          IFS= read -r amd64_digest \
            < /tmp/digests/image-digests-amd64/amd64.digest
          IFS= read -r arm64_digest \
            < /tmp/digests/image-digests-arm64/arm64.digest
          refs=(
            "${IMAGE}@${amd64_digest}"
            "${IMAGE}@${arm64_digest}"
          )
          docker buildx imagetools inspect "${refs[0]}" --raw \
            > /tmp/audited-amd64-index.json
          docker buildx imagetools inspect "${refs[1]}" --raw \
            > /tmp/audited-arm64-index.json
          docker buildx imagetools create -t "$release_ref" "${refs[@]}"
          docker buildx imagetools inspect "$release_ref" --raw \
            > /tmp/release-manifest.json
          python3 scripts/validate_container_manifest.py \
            --final /tmp/release-manifest.json \
            --input linux/amd64=/tmp/audited-amd64-index.json \
            --input linux/arm64=/tmp/audited-arm64-index.json
