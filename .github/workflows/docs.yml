---
# Immutable action SHAs make selected `uses` lines exceed 80 columns.
# yamllint disable rule:line-length
# GitHub Actions requires the literal `on` key.
# yamllint disable rule:truthy

name: Documentation book

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "book.toml"
      - "docs/**"
      - "theme/**"
      - "scripts/check_book.py"
      - "scripts/check_book_output.py"
      - "scripts/install_mdbook.sh"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "book.toml"
      - "docs/**"
      - "theme/**"
      - "scripts/check_book.py"
      - "scripts/check_book_output.py"
      - "scripts/install_mdbook.sh"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build published book
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate and build book
        run: make book

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/book

  deploy:
    name: Publish book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
