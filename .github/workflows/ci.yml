name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    name: Pinned release gate (Rust + Lean + Node)
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout pinned to an immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node pinned to an immutable commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # dtolnay/rust-toolchain
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Install exact deep-verification tools
        timeout-minutes: 20
        run: |
          rustup toolchain install nightly-2026-09-01 --profile minimal
          rustup component add miri rust-src --toolchain nightly-2026-09-01
          fuzz_cargo="$(rustup which \
            --toolchain nightly-2026-09-01 cargo)"
          fuzz_bin="$(dirname "$fuzz_cargo")"
          cargo install \
            --locked cargo-audit --version '=0.22.2'
          PATH="$fuzz_bin:$PATH" cargo install \
            --locked cargo-fuzz --version '=0.13.2'
          PATH="$fuzz_bin:$PATH" cargo install \
            --locked kani-verifier --version '=0.67.0'
          cargo kani setup
      - name: Cache elan toolchains
        # actions/cache pinned to an immutable commit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean/lean-toolchain') }}
      - name: Cache lake build artifacts
        # actions/cache pinned to an immutable commit.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            lean/.lake
            ~/.cache/lake
          key: >-
            ${{ runner.os }}-lake-${{ hashFiles(
            'lean/lean-toolchain', 'lean/lakefile.lean',
            'lean/lake-manifest.json') }}
      - name: Install Lean (elan)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            elan_commit=227caca133724d5516bee25c2aeb3e609478f2d8
            elan_sha256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
            elan_url="https://raw.githubusercontent.com/leanprover/elan"
            curl -fsSL \
              "$elan_url/$elan_commit/elan-init.sh" \
              -o /tmp/elan-init.sh
            echo "$elan_sha256  /tmp/elan-init.sh" | sha256sum -c -
            sh /tmp/elan-init.sh -y
            rm /tmp/elan-init.sh
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Lean dependencies (mathlib cache)
        timeout-minutes: 15
        working-directory: lean
        run: lake exe cache get
      - name: Run exact release decision
        timeout-minutes: 90
        run: make release-gate

  k8s-manifests:
    name: Kubernetes Manifests
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout pinned to an immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # azure/setup-helm pinned to an immutable commit.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Install kubeconform
        run: |
          set -euo pipefail
          ver="v0.8.0"
          archive=/tmp/kubeconform.tgz
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz"
          sha256="9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
          echo "$sha256  $archive" |
            sha256sum -c -
          ARCHIVE="$archive" python3 - <<'PY'
          import os
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE"])
          output = Path("/tmp/kubeconform")
          with tarfile.open(archive, "r:gz") as source:
              members = source.getmembers()
              expected = {
                  "LICENSE": (11_346, 0o644),
                  "kubeconform": (13_944_911, 0o755),
              }
              if len(members) != len(expected):
                  raise SystemExit("unexpected kubeconform archive entry count")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or len(path.parts) != 1:
                      raise SystemExit("unsafe kubeconform archive path")
                  if not member.isreg() or member.name not in expected:
                      raise SystemExit("unexpected kubeconform archive entry")
                  size, mode = expected[member.name]
                  if member.size != size or member.mode & 0o777 != mode:
                      raise SystemExit("kubeconform archive metadata mismatch")
              binary = source.extractfile("kubeconform")
              if binary is None:
                  raise SystemExit("kubeconform binary missing")
              with output.open("xb") as target:
                  shutil.copyfileobj(binary, target, length=1024 * 1024)
              output.chmod(0o755)
          PY
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v
      - name: Helm lint
        run: |
          helm lint deploy/helm/axiograph
          helm lint deploy/helm/axiograph \
            -f deploy/helm/axiograph/values-replicas.yaml
          helm lint deploy/helm/axiograph \
            -f deploy/helm/axiograph/values-ingress.yaml
          helm lint deploy/helm/axiograph \
            -f deploy/helm/axiograph/values-rwx-sync.yaml
      - name: Render Helm chart
        run: helm template axiograph deploy/helm/axiograph > /tmp/axiograph.yaml
      - name: Assert hardened workload security contexts
        run: |
          for manifest in \
            deploy/k8s/axiograph-db-statefulset.yaml \
            /tmp/axiograph.yaml; do
            grep -q 'runAsNonRoot: true' "$manifest"
            grep -q 'type: RuntimeDefault' "$manifest"
            grep -q 'allowPrivilegeEscalation: false' "$manifest"
            grep -q 'readOnlyRootFilesystem: true' "$manifest"
            grep -q -- '- ALL' "$manifest"
          done
      - name: Validate raw manifests
        run: >-
          kubeconform -strict -summary
          -kubernetes-version 1.28.0 deploy/k8s/*.yaml
      - name: Validate Helm render
        run: >-
          kubeconform -strict -summary
          -kubernetes-version 1.28.0 /tmp/axiograph.yaml

  container-build:
    name: Container Build (Dockerfile)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout pinned to an immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # docker/setup-buildx-action pinned to an immutable commit.
      - uses: >-
          docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Validate Dockerfile with BuildKit
        run: docker buildx build --check --progress=plain -f Dockerfile .
      - name: Build container image (no push)
        # docker/build-push-action pinned to an immutable commit.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: axiograph:ci-${{ matrix.arch }}
      - name: Run packaged checker accept/reject release corpus
        run: |
          set -euo pipefail
          image="axiograph:ci-${{ matrix.arch }}"
          checker_dir="$(mktemp -d)"
          container_id="$(docker create "$image")"
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            rm -rf "$checker_dir"
          }
          trap cleanup EXIT
          docker cp \
            "$container_id:/usr/local/bin/axiograph_verify" \
            "$checker_dir/axiograph_verify"
          docker rm "$container_id" >/dev/null
          container_id=""
          chmod 0755 "$checker_dir/axiograph_verify"
          python3 scripts/run_release_fixture_suite.py \
            --checker "$checker_dir/axiograph_verify" \
            --manifest release/fixtures.json \
            --repo-root "$PWD"
      - name: Validate packaged checker and accepted-plane build receipts
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            axiograph:ci-${{ matrix.arch }} \
            -ec '
              cd /usr/local/bin
              sha256sum -c \
                /usr/local/share/axiograph/axiograph_verify.sha256
              marker=/usr/local/share/axiograph/accepted-plane-smoke.json
              grep -Fx "  \"accepted_manifest\": \"verified\"," "$marker"
              schema_value=axiograph-container-accepted-plane-smoke-v2
              grep -Fx "  \"schema\": \"$schema_value\"," "$marker"
              grep -Fx "  \"unaccepted_manifest\": \"rejected\"" "$marker"
            '
      - name: Reject a tampered packaged trusted checker
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            axiograph:ci-${{ matrix.arch }} \
            -ec '
              work="$(mktemp -d)"
              cp /usr/local/bin/axiograph_verify "$work/axiograph_verify"
              cp /usr/local/share/axiograph/axiograph_verify.sha256 \
                "$work/axiograph_verify.sha256"
              printf "tampered\n" >> "$work/axiograph_verify"
              cd "$work"
              if sha256sum -c axiograph_verify.sha256; then
                echo "tampered checker passed checksum validation" >&2
                exit 1
              fi
            '
      - name: Smoke test canonical input and authenticated DB CLI contract
        run: |
          set -euo pipefail
          fixture="$PWD/examples/ontology/OntologyRewrites.axi"
          image="axiograph:ci-${{ matrix.arch }}"

          docker run --rm \
            -v "$fixture:/tmp/ContainerSmoke.axi:ro" \
            "$image" check validate /tmp/ContainerSmoke.axi

          help="$(docker run --rm "$image" db --help)"
          grep -q 'materialize' <<<"$help"
          grep -q 'materialization-show' <<<"$help"
          grep -q 'serve' <<<"$help"
          if grep -qE '(^|[[:space:]])accept([[:space:]]|$)' <<<"$help"; then
            echo "removed accepted-plane CLI unexpectedly present" >&2
            exit 1
          fi

          if docker run --rm "$image" db serve \
            --axpd /tmp/unbound.axpd --listen 127.0.0.1:7878; then
            echo "bare --axpd server startup unexpectedly succeeded" >&2
            exit 1
          fi
