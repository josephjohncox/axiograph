---
name: Publish release assets
description: Stage, verify, and publish exact assets for the current tag
inputs:
  files:
    description: Newline-delimited exact artifact paths
    required: true
runs:
  using: composite
  steps:
    - name: Stage, verify, and publish release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_FILES: ${{ inputs.files }}
      run: ./scripts/publish_github_release.sh
