---
# Example: RWX-backed shared storage for replicas pinned to one immutable
# materialization id. Populate the complete AxiStore image+receipt family before
# advancing the configured id.
statefulset:
  replicas: 2
  args:
    - db
    - serve
    - --dir
    - /data/store
    - --materialization
    - $(AXIOGRAPH_MATERIALIZATION_ID)
    - --listen
    - 0.0.0.0:7878
  persistence:
    enabled: true
    storageClass: "<rwx-storage-class>"
    size: 50Gi

service:
  type: ClusterIP
