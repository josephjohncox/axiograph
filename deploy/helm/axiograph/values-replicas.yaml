---
# Example: multiple read-only replicas pinned to one immutable materialization.
# Replicas require shared access to the complete AxiStore image+receipt family.
statefulset:
  replicas: 3
  args:
    - db
    - serve
    - --dir
    - /data/store
    - --materialization
    - $(AXIOGRAPH_MATERIALIZATION_ID)
    - --listen
    - 0.0.0.0:7878
  persistence:
    enabled: true
    # For >1 replicas, use an RWX-capable storage class or an external sync job.
    # storageClass: "<rwx-storage-class>"

service:
  type: ClusterIP
