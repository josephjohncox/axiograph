---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axiograph-db
  labels:
    app: axiograph-db
spec:
  serviceName: axiograph-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: axiograph-db
  template:
    metadata:
      labels:
        app: axiograph-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: axiograph
          image: ghcr.io/josephjohncox/axiograph:v20260829.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - db
            - serve
            - --dir
            - /data/store
            - --materialization
            - $(AXIOGRAPH_MATERIALIZATION_ID)
            - --listen
            - 0.0.0.0:7878
          env:
            - name: AXIOGRAPH_MATERIALIZATION_ID
              value: "REPLACE_WITH_MATERIALIZATION_ID_V2"
          ports:
            - name: http
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
